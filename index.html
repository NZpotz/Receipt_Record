<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e12"><title>Trip Receipt Record</title><style>
:root{color-scheme:dark;--bg:#0b0e12;--card:#151a21;--card2:#10141a;--text:#f4f7fb;--muted:#9ca8b7;--line:#29313c;--blue:#4ea1ff;--blue2:#1675da;--red:#ff6666;--green:#5bd39a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:1.45rem;margin:5px 0 2px}.sub{color:var(--muted);font-size:.88rem;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 8px 28px #0004}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:.78rem;color:#bac4d1;margin:0 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid #343d49;border-radius:10px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4ea1ff22}textarea{resize:vertical;min-height:74px}.ref{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card2);padding:10px 12px;border-radius:10px;border:1px solid var(--line)}.ref b{color:var(--blue)}.photo{display:block;border:1px dashed #465261;border-radius:12px;padding:12px;text-align:center;background:#0c1015}.photo input{border:0;padding:5px}.photo img{display:none;width:100%;max-height:380px;object-fit:contain;margin-top:10px;border-radius:10px;background:#050607}.switch{display:flex;align-items:center;gap:9px;color:#cbd4df;font-size:.9rem}.switch input{width:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:10px;padding:12px 14px;font-weight:650;cursor:pointer}.primary{background:var(--blue2);color:white}.secondary{background:#242c36;color:white;border:1px solid #384350}.danger{background:#3b1c20;color:#ffb6bc;border:1px solid #683039}.small{padding:8px 10px;font-size:.82rem}.summary{display:flex;gap:16px;flex-wrap:wrap;color:#c9d3df;font-size:.9rem}.summary b{color:white}.receipt{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:9px;display:grid;grid-template-columns:1fr auto;gap:8px}.receipt .meta{color:var(--muted);font-size:.8rem;margin-top:4px}.receipt .amount{text-align:right;font-weight:700}.receipt img{grid-column:1/-1;width:100%;max-height:180px;object-fit:contain;background:#050607;border-radius:8px;margin-top:5px}.empty{color:var(--muted);text-align:center;padding:20px 8px}.status{font-size:.8rem;color:var(--green);min-height:18px;margin-top:7px}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:end}.toprow>div{flex:1}@media(max-width:520px){.grid,.actions{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px 10px 32px}.card{padding:12px}}
</style></head><body><main class="wrap"><h1>Trip Receipt Record</h1><div class="sub">Fast offline receipt capture. Records stay on this device unless exported.</div>
<section class="card"><div class="toprow"><div><label for="trip">Trip name</label><input id="trip" placeholder="e.g. Vanuatu - Nov 2026"></div><button class="secondary small" id="newTrip" type="button">New trip</button></div></section>
<section class="card"><div class="ref"><span>Receipt reference</span><b id="ref">R-001</b></div><div class="grid" style="margin-top:12px"><div><label for="date">Date</label><input id="date" type="date"></div><div><label for="merchant">Merchant / supplier</label><input id="merchant" placeholder="Hotel, taxi, restaurant..."></div><div><label for="category">Category</label><select id="category"><option>Meals</option><option>Accommodation</option><option>Transport</option><option>Flights</option><option>Parking</option><option>Fuel</option><option>Other</option></select></div><div><label for="amount">Amount</label><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div><div><label for="currency">Currency</label><select id="currency"><option>NZD</option><option>AUD</option><option>USD</option><option>EUR</option><option>GBP</option><option>FJD</option><option>VUV</option><option>XPF</option><option>Other</option></select></div><div class="full"><label for="notes">Notes</label><textarea id="notes" placeholder="Project, attendees, reason or other detail"></textarea></div></div>
<div class="photo" style="margin-top:11px"><label for="photo">Receipt photo</label><input id="photo" type="file" accept="image/*"><div id="photoInfo" style="margin:7px 0;color:#9ca8b7;font-size:.78rem"></div><div class="switch"><input id="trim" type="checkbox" checked><span>Auto-trim / crop image margins</span></div><img id="preview" alt="Receipt preview"></div><div class="actions"><button id="save" class="primary" type="button">Save receipt</button><button id="clear" class="secondary" type="button">Clear form</button></div><div id="status" class="status" aria-live="polite"></div></section>
<section class="card"><div class="summary"><span>Receipts: <b id="count">0</b></span><span>Current trip: <b id="tripLabel">Not named</b></span></div><div class="actions"><button id="csv" class="secondary" type="button">Export CSV</button><button id="backup" class="secondary" type="button">Backup JSON</button></div><div id="list"></div></section></main>
<script>
const $=id=>document.getElementById(id), key='tripReceiptRecord.v2';let state={trip:'',next:1,receipts:[]}, photoData='';
function load(){try{const s=JSON.parse(localStorage.getItem(key));if(s)state=s}catch(e){} $('trip').value=state.trip||'';today();render()}
function persist(){localStorage.setItem(key,JSON.stringify(state))}
function today(){if(!$('date').value)$('date').value=new Date().toISOString().slice(0,10)}
function ref(){return 'R-'+String(state.next).padStart(3,'0')}
function render(){$('ref').textContent=ref();$('count').textContent=state.receipts.length;$('tripLabel').textContent=state.trip||'Not named';const box=$('list');box.innerHTML='';if(!state.receipts.length){box.innerHTML='<div class="empty">No receipts saved yet.</div>';return}state.receipts.slice().reverse().forEach(r=>{const d=document.createElement('div');d.className='receipt';const left=document.createElement('div');left.innerHTML='<b>'+esc(r.ref)+' · '+esc(r.merchant||'Unnamed merchant')+'</b><div class="meta">'+esc(r.date)+' · '+esc(r.category)+' · '+esc(r.currency)+(r.notes?' · '+esc(r.notes):'')+'</div>';const amt=document.createElement('div');amt.className='amount';amt.textContent=Number(r.amount||0).toFixed(2);const del=document.createElement('button');del.className='danger small';del.textContent='Delete';del.type='button';del.onclick=()=>{if(confirm('Delete '+r.ref+'?')){state.receipts=state.receipts.filter(x=>x.id!==r.id);persist();render()}};const right=document.createElement('div');right.append(amt,del);d.append(left,right);if(r.photo){const im=document.createElement('img');im.src=r.photo;d.append(im)}box.append(d)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('trip').addEventListener('change',()=>{state.trip=$('trip').value.trim();persist();render()});
$('photo').addEventListener('change',async e=>{
 const f=e.target.files&&e.target.files[0]; if(!f)return;
 photoData=''; $('status').textContent='Loading photo...';
 $('photoInfo').textContent=f.name+' · '+formatBytes(f.size)+(f.type?' · '+f.type:'');
 try{
   const original=await readDataURL(f);
   showPreview(original); // show immediately before any conversion
   photoData=original;    // reliable fallback if processing fails
   try{
     const processed=await processImage(original,$('trim').checked);
     photoData=processed.data;
     showPreview(photoData);
     $('photoInfo').textContent=f.name+' · '+formatBytes(f.size)+' · '+processed.w+' × '+processed.h+' · ready';
     $('status').textContent='Photo loaded successfully.';
   }catch(procErr){
     console.warn('Image processing failed; using original file.',procErr);
     $('photoInfo').textContent=f.name+' · '+formatBytes(f.size)+' · original image retained';
     $('status').textContent='Photo loaded. Image processing was skipped.';
   }
 }catch(err){
   console.error('Photo load failed',err); photoData=''; $('preview').removeAttribute('src'); $('preview').style.display='none';
   $('photoInfo').textContent=f.name+' · unable to read this image';
   $('status').textContent='Could not load this photo. Try a JPG or PNG, or take a screenshot of the receipt.';
 }
});
function readDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>typeof r.result==='string'?resolve(r.result):reject(new Error('No image data'));r.onerror=()=>reject(r.error||new Error('File read failed'));r.onabort=()=>reject(new Error('File read cancelled'));r.readAsDataURL(file)})}
function showPreview(src){$('preview').onerror=()=>{$('status').textContent='The selected file was read, but Android could not preview this image format.'};$('preview').src=src;$('preview').style.display='block'}
function processImage(src,trim){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{try{let sx=0,sy=0,sw=im.naturalWidth||im.width,sh=im.naturalHeight||im.height;if(!sw||!sh)throw new Error('Invalid dimensions');if(trim){const pad=.025;sx=Math.round(sw*pad);sy=Math.round(sh*pad);sw=Math.max(1,Math.round(sw*(1-2*pad)));sh=Math.max(1,Math.round(sh*(1-2*pad)))}const max=1600,scale=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));const ctx=c.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');ctx.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);let out;try{out=c.toDataURL('image/jpeg',.82)}catch(e){throw new Error('JPEG conversion failed')}if(!out||out==='data:,')throw new Error('Empty conversion');resolve({data:out,w:c.width,h:c.height})}catch(e){reject(e)}};im.onerror=()=>reject(new Error('Browser could not decode image'));im.src=src})}
function formatBytes(n){if(!Number.isFinite(n))return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function clearForm(){$('merchant').value='';$('amount').value='';$('notes').value='';$('photo').value='';$('preview').src='';$('preview').style.display='none';$('photoInfo').textContent='';photoData='';today()}
$('clear').onclick=clearForm;
$('save').onclick=()=>{state.trip=$('trip').value.trim();const amount=parseFloat($('amount').value);if(!$('date').value){$('status').textContent='Enter a date.';return}if(!Number.isFinite(amount)||amount<0){$('status').textContent='Enter a valid amount.';return}const r={id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),ref:ref(),trip:state.trip,date:$('date').value,merchant:$('merchant').value.trim(),category:$('category').value,amount,currency:$('currency').value,notes:$('notes').value.trim(),photo:photoData};state.receipts.push(r);state.next++;persist();clearForm();render();$('status').textContent=r.ref+' saved.';setTimeout(()=>$('status').textContent='',2500)};
$('newTrip').onclick=()=>{const name=prompt('New trip name:');if(name!==null&&name.trim()){state={trip:name.trim(),next:1,receipts:[]};persist();$('trip').value=state.trip;clearForm();render()}};
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('csv').onclick=()=>{const rows=[['Reference','Trip','Date','Merchant','Category','Amount','Currency','Notes'],...state.receipts.map(r=>[r.ref,r.trip,r.date,r.merchant,r.category,r.amount,r.currency,r.notes])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download((state.trip||'trip')+'-receipts.csv','text/csv;charset=utf-8',csv)};
$('backup').onclick=()=>download((state.trip||'trip')+'-receipt-backup.json','application/json',JSON.stringify(state,null,2));
load();
</script></body></html>
